name: Waka Readme

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          API_BASE_URL: ${{ secrets.WAKAPI_BASE_URL }}
          WAKATIME_API_KEY: ${{ secrets.WAKAPI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 提交消息
          COMMIT_MESSAGE: Update Wakapi stats
          # 图形配置（已优化为支持的格式）
          PROGRESS_BAR_CHAR: "▓"
          BLOCK_COLORS: "lightgray,yellow,green"
          # 核心：指定全时间范围（保留你的配置，确保拉取所有时间的语言数据）
          TIME_RANGE: all_time
          # 显式开启语言展示功能（默认true，显式配置更稳妥，避免被隐式禁用）
          SHOW_LANGUAGES: true
          # 可选：自定义展示的语言数量（默认5种，改为10种可展示更多全时间语言）
          LANGUAGES_COUNT: 10
          # 其他原有配置保持不变
          SHOW_TIME: true
          SHOW_TOTAL_CODE_TIME: False
          SHOW_PROFILE_VIEWS: False
          SHOW_SHORT_INFO: False
          SHOW_COMMIT: False
          SHOW_DAYS_OF_WEEK: False
          SHOW_OS: False
          SHOW_PROJECTS: False
          SHOW_TIMEZONE: False
          SHOW_EDITORS: False
          SHOW_LANGUAGE_PER_REPO: False
          SHOW_LOC_CHART: False
          SHOW_UPDATED_DATE: False
          LOCALE: en
          CODE_LANG: rust
